name: Mise à jour des données TCL

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *' # le 1er de chaque mois

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run data     # tracés + arrêts (data.gouv.fr)
      - name: Ouvrir une Pull Request si les données ont changé
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data; then echo "Aucun changement"; exit 0; fi
          branch="data/maj-$(date +%Y%m%d)"
          git config user.name "nav-lyon-bus bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add data
          git commit -m "chore(data): mise à jour lignes et arrêts"
          git push origin "$branch"
          gh pr create --title "Mise à jour des données TCL ($(date +%d/%m/%Y))" --body "Mise à jour automatique des tracés et arrêts depuis data.gouv.fr. À relire avant fusion." --base main --head "$branch"
