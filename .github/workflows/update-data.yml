name: Mise à jour des données TCL

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *' # le 1er de chaque mois

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run data     # tracés + arrêts (data.gouv.fr)
      - run: npm run geo      # plages d'adresses françaises (RIPE NCC)
      - name: Commit des données
        run: |
          git config user.name "nav-lyon-bus bot"
          git config user.email "actions@users.noreply.github.com"
          git add data geo/fr-ranges.php
          git diff --cached --quiet || git commit -m "chore(data): mise à jour lignes, arrêts et plages FR"
          git push
